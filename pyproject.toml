[project]
name = "kleinvae"
version = "0.9.5"
description = "Variational autoencoders with Euclidean, torus, and Klein-bottle latent spaces"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # --------- pytorch --------- #
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "lightning>=2.0.0",
    "torchmetrics>=0.11.4",
    # ---------- data ----------- #
    "pandas>=2.2.3",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.2",
    "plotly>=6.1.0",
    "matplotlib>=3.10.3",
    # -------- topology --------- #
    "persim>=0.3.8",
    "ripser>=0.6.12",
    # ---------- hydra ---------- #
    "hydra-core>=1.3.2",
    "rich==13.9.2",
    "omegaconf>=2.3.0",
    "hydra-colorlog>=1.2.0",
    # --------- others ---------- #
    "pytest>=9.0.3",
    "rootutils",
    "wandb",
]

[project.optional-dependencies]
mpp = ["multipers"]
umap = ["umap-learn"]

[dependency-groups]
dev = ["ipykernel>=6.29.5", "nbformat>=5.10.4", "uv>=0.6.10", "sh"]

[tool.pytest.ini_options]
addopts = [
    "--color=yes",
    "--durations=0",
    "--strict-markers",
    "--doctest-modules",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
log_cli = "True"
markers = ["slow: slow tests"]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]
