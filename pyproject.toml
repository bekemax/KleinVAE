[project]
name = "kleinvae"
version = "0.9.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # --------- pytorch --------- #
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "lightning>=2.0.0",
    "torchmetrics>=0.11.4",
    # ---------- data ----------- #
    "pandas>=2.2.3",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.2",
    "plotly>=6.1.0",
    "matplotlib>=3.10.3",
    # --------- others ---------- #
    "rootutils",
]

[project.optional-dependencies]
mpp = ["multipers"]
persistence = ["persim>=0.3.8", "ripser>=0.6.12"]
umap = ["umap-learn"]

[dependency-groups]
dev = ["ipykernel>=6.29.5", "nbformat>=5.10.4", "uv>=0.6.10", "sh"]
