# @package _global_
#
# Produces results/converged_euclid: the Euclidean dimension ladder at lr 3e-4.

# The Euclidean latent-dimension sweep on the same converged protocol as converged_quotient.
#
# Run with:
#   uv run python scripts/run_capacity_ablation.py --ablation converged_euclid

defaults:
  - override /hydra/sweeper: basic
  - override /hydra/launcher: joblib

hydra:
  mode: "MULTIRUN"
  launcher:
    n_jobs: 6
  sweeper:
    params:
      experiment: converged_protocol
      model: vanilla_vae
      arch: official
      seed: 27,28,29
      model.model.latent_dim: 2,3,4,5

logger:
  wandb:
    group: converged-protocol
    offline: True
