_target_: src.models.vanilla_vae_module.VanillaVAEModule

# VAE hyperparameters
latent_dim: 2
lr: 1e-3
kl_weight: 1e-2
topo_metric_freq: 10

# SimpleVAE network configuration
model:
  _target_: src.models.components.vae.SimpleVAE
  input_dim: 900 # 30x30 for circles dataset
  hidden_dims: ${hidden_dims} #[1024, 512, 128, 32]
  latent_dim: ${..latent_dim}

# Optimizer configuration
optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: ${..lr}
  weight_decay: 0.0

# Scheduler configuration
scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.1
  patience: 10
